<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TodoFloat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="renderer/style.css" />
</head>

<body>
  <div id="app">

    <div id="titlebar">
      <div id="drag-region">
        <span id="app-icon">✦</span>
        <span id="app-title">TodoFloat</span>
      </div>
      <div id="titlebar-controls">
        <button id="btn-collapse" title="Collapse / Expand">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
        <button id="btn-pin" title="Pin window">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L14.5 9H21L15.5 13.5L17.5 21L12 17L6.5 21L8.5 13.5L3 9H9.5L12 2Z" stroke="currentColor"
              stroke-width="1.8" stroke-linejoin="round" />
          </svg>
        </button>
        <button id="btn-min" title="Minimize">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
        <button id="btn-close" title="Close to tray">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 2L10 10M10 2L2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    <div id="stats-bar">
      <span id="stat-total"></span>
      <span id="stat-done"></span>
      <span id="stat-overdue"></span>
    </div>

    <div id="search-bar">
      <span id="search-icon">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.5" />
          <path d="M8.5 8.5L11 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </span>
      <input type="text" id="inp-search" placeholder="Search tasks..." maxlength="80" autocomplete="off" />
      <button id="search-clear" class="hidden" title="Clear search">✕</button>
    </div>

    <!-- Status tabs -->
    <div id="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="today">Today</button>
      <button class="filter-btn" data-filter="daily">Daily</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <!-- Three filter chips -->
    <div id="filter-actions-bar">
      <div class="filter-chip-wrap">
        <button class="filter-chip" id="chip-category">Category</button>
        <div class="chip-dropdown hidden" id="dd-category">
          <div class="dd-options" id="fd-cat-options">
            <button class="fd-opt active" data-type="cat" data-val="all">All</button>
          </div>
          <div class="dd-divider"></div>
          <div class="dd-add">
            <input type="text" id="inp-cat" placeholder="New category..." maxlength="20" />
            <button id="btn-cat-save">Add</button>
          </div>
        </div>
      </div>

      <div class="filter-chip-wrap">
        <button class="filter-chip" id="chip-priority">Priority</button>
        <div class="chip-dropdown hidden" id="dd-priority">
          <div class="dd-options">
            <button class="fd-opt active" data-type="prio" data-val="all">All</button>
            <button class="fd-opt" data-type="prio" data-val="high">High</button>
            <button class="fd-opt" data-type="prio" data-val="med">Med</button>
            <button class="fd-opt" data-type="prio" data-val="low">Low</button>
          </div>
        </div>
      </div>

      <div class="filter-chip-wrap">
        <button class="filter-chip" id="chip-recurring">Recurring</button>
        <div class="chip-dropdown hidden" id="dd-recurring">
          <div class="dd-options">
            <button class="fd-opt active" data-type="recurring" data-val="all">All</button>
            <button class="fd-opt" data-type="recurring" data-val="daily">Daily</button>
            <button class="fd-opt" data-type="recurring" data-val="weekly">Weekly</button>
            <button class="fd-opt" data-type="recurring" data-val="monthly">Monthly</button>
          </div>
        </div>
      </div>
    </div>

    <div id="task-list-wrapper">
      <ul id="task-list"></ul>
      <div id="empty-state">
        <span>✦</span>
        <p>Nothing here yet.<br />Add your first task!</p>
      </div>
    </div>

    <button id="fab" title="Add Task">+</button>
    <div id="resize-grip"></div>

  </div>

  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-header">
        <h2 id="modal-title">New Task</h2>
        <button id="modal-close">✕</button>
      </div>
      <div class="field">
        <label>Task title</label>
        <input type="text" id="inp-title" placeholder="What needs to be done?" maxlength="120" />
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="inp-notes" placeholder="Optional notes..." rows="2"></textarea>
      </div>
      <div class="field">
        <label>Priority</label>
        <div id="prio-select">
          <button class="prio-opt" data-val="high">High</button>
          <button class="prio-opt active" data-val="med">Med</button>
          <button class="prio-opt" data-val="low">Low</button>
        </div>
      </div>
      <div class="field-row">
        <div class="field half">
          <label>Category</label>
          <select id="inp-category">
            <option value="">None</option>
          </select>
        </div>
        <div class="field half">
          <label>Repeat</label>
          <select id="inp-repeat">
            <option value="">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Due date & time</label>
        <div id="datetime-picker">
          <div id="calendar-wrap"></div>
          <div id="time-wrap">
            <div id="time-display">
              <span id="time-hrs">12</span>
              <span class="time-sep">:</span>
              <span id="time-mins">00</span>
              <span id="time-ampm">AM</span>
            </div>
            <div id="time-sliders">
              <div class="slider-row">
                <span class="slider-lbl">H</span>
                <input type="range" id="sl-hrs" min="1" max="12" value="12" />
              </div>
              <div class="slider-row">
                <span class="slider-lbl">M</span>
                <input type="range" id="sl-mins" min="0" max="59" value="0" />
              </div>
              <button id="ampm-toggle">AM</button>
            </div>
          </div>
        </div>
        <div id="due-clear-row">
          <span id="due-preview"></span>
          <button id="due-clear" class="hidden">Clear date</button>
        </div>
      </div>
      <div class="field">
        <label>Subtasks</label>
        <div id="subtask-input-row">
          <input type="text" id="inp-subtask" placeholder="Add subtask..." maxlength="80" />
          <button id="btn-add-subtask">+</button>
        </div>
        <ul id="subtask-list"></ul>
      </div>
      <div id="modal-actions">
        <button id="btn-cancel">Cancel</button>
        <button id="btn-save">Save Task</button>
      </div>
    </div>
  </div>

  <div id="cat-context-menu" class="hidden">
    <button id="cat-ctx-delete">Delete category</button>
  </div>

  <div id="toast-container"></div>
  <script src="renderer/app.js"></script>
</body>

</html>
